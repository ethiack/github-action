name: Release
run-name: "Release `${{ github.ref_name }}` (SHA: ${{ github.sha }})"

on:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  checks:
    name: Run Checks
    uses: ./.github/workflows/checks.base.yaml

  release:
    name: Release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Generate GitHub App token
        id: app-token
        if: ${{ secrets.ETHIACK_RELEASE_BOT_APP_ID != '' && secrets.ETHIACK_RELEASE_BOT_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.ETHIACK_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.ETHIACK_RELEASE_BOT_APP_PRIVATE_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "lts/*"

      - name: Install plugins
        run: >
          npm install -D
          @semantic-release/git
          @semantic-release/changelog
          conventional-changelog-conventionalcommits
          @saithodev/semantic-release-backmerge

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: npx semantic-release
